name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity.
# A tiny read every 3 days keeps the database active. Uses the same public
# values the website uses (repository secrets, see README).
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one listing
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "Add the VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY secrets first."; exit 1; fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/listings?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase responded $status"
          test "$status" = "200"
